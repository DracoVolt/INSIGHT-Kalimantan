[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-kalimantan"
version = "0.1.0"
description = "Wildfire spread simulation and civilian-mitigation guidance for Central Kalimantan. A high-school science project combining OSM data, FIRMS hotspots, a physics CA, and a baseline ML model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "INSIGHT project" }
]

classifiers = [
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "requests",
    "scikit-learn",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "streamlit",
    "folium",
    "jupyter",
    "ipython",
    "pytest",
    "flake8",
    "ruff",
]

[project.scripts]
insight = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "src"]
